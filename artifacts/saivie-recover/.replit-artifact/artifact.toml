kind = "web"
previewPath = "/recover/"
title = "SaivieRecover"
version = "1.0.0"
id = "artifacts/saivie-recover"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/recover/" ]
localPort = 21982

[services.development]
run = "pnpm --filter @workspace/saivie-recover run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saivie-recover", "run", "build" ]
publicDir = "artifacts/saivie-recover/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21982"
BASE_PATH = "/recover/"
