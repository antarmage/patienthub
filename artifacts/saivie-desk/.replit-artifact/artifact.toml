kind = "web"
previewPath = "/desk/"
title = "SaivieDesk"
version = "1.0.0"
id = "artifacts/saivie-desk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/desk/" ]
localPort = 19042

[services.development]
run = "pnpm --filter @workspace/saivie-desk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saivie-desk", "run", "build" ]
publicDir = "artifacts/saivie-desk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19042"
BASE_PATH = "/desk/"
