name: Deploy Saivie Frontends to AWS S3

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/saivie/**'
      - 'artifacts/saivie-desk/**'
      - 'artifacts/saivie-recover/**'
      - 'artifacts/saiviegene/**'
      - 'scripts/deploy-frontends.sh'
      - '.github/workflows/deploy-frontends.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-deploy-frontends:
    name: Build and deploy web apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend bundles
        run: bash scripts/deploy-frontends.sh
