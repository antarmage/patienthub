logging:
  level: WARNING
pipeline:
  maas:
    enabled: false
  ocr_api:
    api_host: ocr-model
    api_port: 8000
    model: glm-ocr
    api_path: /v1/chat/completions
    verify_ssl: true
    request_timeout: 120
    retry_max_attempts: 0
  layout:
    device: cpu
  max_workers: 4
  page_loader:
    pdf_max_pages: null
