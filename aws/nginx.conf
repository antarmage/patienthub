# =============================================================================
# nginx.conf — Reference config for self-hosted / EC2 deployments
#
# NOTE: If you use S3 + CloudFront for frontends and ECS Fargate for the API
# (the recommended approach), you do NOT need this file. It is provided only
# as a reference if you prefer to self-host everything on EC2.
#
# Place at: /etc/nginx/sites-available/saivie
# Enable:   ln -s /etc/nginx/sites-available/saivie /etc/nginx/sites-enabled/
# Test:     nginx -t
# Reload:   systemctl reload nginx
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_kiosk:10m   rate=10r/m;

# ── Main portal: app.saivie.com ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.saivie.com;

    ssl_certificate     /etc/letsencrypt/live/app.saivie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.saivie.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/saivie;
    index index.html;

    # Hashed assets — cache 1 year
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"  always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
}

