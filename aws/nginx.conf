# ── API: api.saivie.com ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.saivie.com;

    ssl_certificate     /etc/letsencrypt/live/api.saivie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.saivie.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Proxy to ECS Fargate (or EC2) API server
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # File upload limit (genome files can be large)
        client_max_body_size 50M;

        # Rate limiting
        limit_req zone=api_general burst=50 nodelay;
    }

    # Stricter rate limit on auth endpoints
    location ~* ^/api/(mobile/auth|staff/otp|kiosk/lookup) {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        limit_req zone=api_auth burst=5 nodelay;
        client_max_body_size 1M;
    }

    add_header X-Content-Type-Options "nosniff" always;
}

# ── HTTP → HTTPS redirects ────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.saivie.com desk.saivie.com recover.saivie.com gene.saivie.com api.saivie.com;
    return 301 https://$host$request_uri;
}
